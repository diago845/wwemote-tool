<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WWEmote</title>
<style>
:root{
  --bg:#e2eaf7; --card:#eef3fb; --edge:#d3dff2; --ink:#182338; --muted:#8792a5; --line:#e4e9f2;
  --blue:#3d6fe8; --blue2:#2f5bd0; --ok:#18a058; --warn:#e0a300; --err:#d03050;
}
*{box-sizing:border-box}

html,body{height:100%;overflow:hidden;border-radius:12px}

body{margin:0;background:var(--bg);border-radius:12px;
  font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}
.card{height:100%;overflow:hidden;background:var(--card);border:1px solid var(--edge);border-radius:12px;
  display:flex;flex-direction:column;position:relative}
.bar{height:54px;display:flex;align-items:center;padding:0 22px;flex:none;
  border-bottom:1px solid rgba(211,223,242,.9)}
.brand-icon{width:20px;height:20px;border-radius:6px;object-fit:cover;flex:none;margin-right:12px}
.brand{font-size:13px;font-weight:800;letter-spacing:.05em;color:#66738b}
.spacer{flex:1}

.quit{width:30px;height:30px;display:grid;place-items:center;padding:0;
  border:1px solid var(--line);background:#fff;color:#7d8798;
  font-size:17px;font-weight:600;line-height:1;border-radius:9px;cursor:pointer}
.quit:hover{background:#fff5f6;border-color:#f3c6ce;color:#c04055}
.quit:disabled{color:#c3cad6;cursor:default}
.body{padding:36px 60px 30px;overflow:auto}
.eyebrow{margin:0 0 14px;color:var(--blue);font-size:12px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase}
h1{margin:0;color:var(--ink);font-size:22px;line-height:1.4;font-weight:700}
.intro{max-width:640px;margin:12px 0 26px;color:var(--muted);font-size:14px;line-height:1.7}
.intro b{color:#46536c}
.intro code{padding:1px 6px;border-radius:6px;background:#eef2fa;color:#3f4d66;
  font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:12.5px}
.label{display:block;margin-bottom:9px;font-size:13px;font-weight:700;color:#46536c}
.row{display:flex;gap:12px}
.wrap{position:relative;flex:1}
.wrap svg{position:absolute;top:17px;left:17px;width:20px;color:#8792a7}
input{width:100%;height:54px;padding:0 18px 0 49px;border:1px solid var(--line);
  border-radius:13px;outline:none;background:#fff;color:var(--ink);font-size:14px;
  font-family:inherit}
input:focus{border-color:#8aa5f5;box-shadow:0 0 0 4px #3769e81f}
.wrap.dragover>input{border-color:#3d6fe8;box-shadow:0 0 0 4px #3769e83a;background:#f4f8ff}
button{border:0;border-radius:13px;font:inherit;font-weight:700;cursor:pointer}
.browse{min-width:158px;padding:0 18px;border:1px solid var(--line);
  background:#d6e6ff;color:#45536d}
.browse:hover{background:#f8faff;border-color:#b8c6ee}
.actions{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
.options{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.options label{display:flex;align-items:center;gap:8px;font-size:12px;color:#5a6478;cursor:pointer;user-select:none}
.options input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--blue);cursor:pointer;flex:none}
.start{min-width:158px;height:50px;padding:0 24px;background:var(--blue);color:#fff;
  font-size:15px;box-shadow:0 10px 24px rgba(61,111,232,.28)}
.start:hover{background:var(--blue2)}
.start:disabled{background:#b9c6e2;box-shadow:none;cursor:default}

.start.alt{background:#e8efff;color:#2f5bd0;box-shadow:none;
  border:1px solid #c3d4fb;font-size:14px}
.start.alt:hover{background:#dbe7ff;border-color:#a9c0f8}
.start.alt:disabled{background:#eef1f8;color:#9aa6bd;border-color:#e4e9f2;cursor:default}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#c6cede;flex:none}
.dot.live{background:var(--blue);animation:pulse 1.1s ease-in-out infinite}
.dot.ok{background:var(--ok)}
.dot.err{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.meta{margin-top:22px}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:#fbfcff;font-size:12.5px;color:#98a2b5;font-weight:700}
.step.on{border-color:#a9c0f8;background:#eef4ff;color:var(--blue)}
.step.done{border-color:#b6e3c9;background:#effaf3;color:#12864a}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:#5a677f}
.progress-head .pv{font-weight:800;color:var(--blue)}
.progress{height:9px;border-radius:99px;background:#e8edf7;overflow:hidden;margin-top:8px}
.progress-bar{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#5b8def,#3d6fe8);transition:width .35s ease}
.log{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:#0f1626;
  color:#c8d4ea;font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
  font-size:12px;line-height:1.55;max-height:230px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding:14px 16px;
  white-space:pre-wrap;word-break:break-all}
.log:empty{display:block;visibility:hidden}
.body::-webkit-scrollbar,.log::-webkit-scrollbar,.result-slot::-webkit-scrollbar,.summary::-webkit-scrollbar,.errbox::-webkit-scrollbar{width:6px}
.body::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb,.result-slot::-webkit-scrollbar-thumb,.summary::-webkit-scrollbar-thumb,.errbox::-webkit-scrollbar-thumb{background:#c7d2e6;border-radius:99px}
.body::-webkit-scrollbar-track,.log::-webkit-scrollbar-track,.result-slot::-webkit-scrollbar-track,.summary::-webkit-scrollbar-track,.errbox::-webkit-scrollbar-track{background:transparent}
.log .e{color:#ff8f9c}
.log .ok{color:#7ee2a8}
.log .cmd{color:#7fa7ff}
.summary{margin-top:16px;border:1px solid #b6e3c9;background:#f2fbf6;border-radius:14px;
  padding:14px 16px;font-size:13px;line-height:1.8;color:#155f38;display:none}
.summary.show{display:block}
.summary b{color:#0f7a43}
.summary .fail{color:#a3273f}
.errbox{margin-top:16px;border:1px solid #f3c6ce;background:#fff5f6;border-radius:14px;
  padding:14px 16px;font-size:13px;line-height:1.75;color:#a3273f;display:none;
  white-space:pre-wrap}
.errbox.show{display:block}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
  gap:16px;flex-wrap:wrap}
.lang{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
select{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  font:inherit;font-size:12px;padding:7px 10px}
.hint{font-size:12px;color:#a3adbe}
.hint.warn{color:#b8860b}

.bar{height:42px;padding:0 14px}.brand-icon{width:18px;height:18px;margin-right:10px}
.quit{width:25px;height:25px;border-radius:7px;font-size:16px}
.body{padding:10px 18px 10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.body>.topnote,.body>.compactline,.body>.options,.body>.meta{flex:none}
.eyebrow,.body>h1,.body>.label{display:none}
/* The report box absorbs all remaining height and scrolls on its own, so the
   program panel never shows a side scrollbar in the initial state. */
.result-slot{flex:1 1 auto;min-height:96px;position:relative;margin-top:10px;
  display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.result-slot>.summary,.result-slot>.errbox{position:static;margin-top:0;max-height:none;overflow:visible;flex:none}
/* Drag strips on the top and bottom edges resize the window vertically only;
   width is locked in Go. 6px is enough to grab without eating the content. */
.card>.resize-edge{position:absolute;left:0;right:0;height:6px;cursor:ns-resize;z-index:5;touch-action:none}
.card>.resize-edge.top{top:0}
.card>.resize-edge.bottom{bottom:0}

.compactline{display:flex;align-items:end;gap:8px}.compactline>.row{flex:1;min-width:0}
.topnote{margin:0 0 7px;color:#71809a;font-size:11px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{gap:8px}.wrap svg{top:9px;left:12px;width:16px}
input{height:34px;padding-left:38px;border-radius:9px;font-size:12px}
.browse{height:34px;min-width:74px;padding:0 12px;border-radius:9px;font-size:12px}
.actions{margin-top:0;gap:10px;flex:none}.start{min-width:78px;height:34px;padding:0 14px;border-radius:9px;font-size:12px;box-shadow:none}
.status{font-size:11px;white-space:nowrap}.dot{width:7px;height:7px}
.meta{margin-top:8px}.steps{display:none}.progress-head{font-size:11px}.progress{height:6px;margin-top:4px}
.log{margin-top:8px;height:60px;max-height:60px;padding:7px 9px;border-radius:8px;font-size:10px;line-height:1.4}
.foot>.diaglink{margin-right:auto;font-size:11px;color:#9aa0aa;cursor:pointer;text-decoration:none;border:0;background:none;padding:0;font-family:inherit}
.foot>.diaglink:hover{color:#5a6070;text-decoration:underline}
.summary,.errbox{margin-top:0;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.summary.show{display:flex;flex-direction:column;gap:5px}
.summary>div{padding:5px 8px;border:1px solid #d8eadf;border-radius:6px;background:#fbfefc;overflow-wrap:anywhere}
.summary .lead{font-weight:800}
.summary .detail{display:block;margin-top:2px;font-size:10.5px;font-weight:400;color:#64718a;line-height:1.45;overflow-wrap:anywhere}
.summary>.fail{border-color:#f0c4cc;background:#fff5f6;color:#9b2138;font-weight:700;padding:7px 9px}
.summary>.fail .detail{margin-top:6px;color:#814250}
.summary>.fail .err-item{display:block;position:relative;margin:0;padding:5px 8px 5px 18px;
  border-bottom:1px dashed #f0cdd4;line-height:1.45;overflow-wrap:anywhere;font-weight:400;color:#7a3f4b}
.summary>.fail .err-item:last-child{border-bottom:0}
.summary>.fail .err-item::before{content:"";position:absolute;left:5px;top:11px;width:5px;height:5px;
  border-radius:50%;background:#d03050}
.summary>.fail .err-item b{display:inline-block;margin-right:6px;padding:0 5px;border-radius:4px;
  background:#fbe3e7;color:#9b2138;font-size:10px;font-weight:800}
.summary>.fail .err-item .path{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
  font-size:10px;color:#6b3440}
.summary>.fail .err-item .why{color:#8a505b}
.summary>.fail::before{content:"!";display:inline-grid;place-items:center;width:14px;height:14px;margin-right:7px;
  border-radius:50%;background:#d03050;color:#fff;font-size:10px;line-height:1;vertical-align:1px}
/* "configured this run" row: same per-item layout as the failure box, green. */
.summary>.ok{border-color:#b6e3c9;background:#f4fcf7;color:#0f7a43;font-weight:700;padding:7px 9px}
.summary>.ok .detail{margin-top:6px;color:#356149}
.summary>.ok .err-item{display:block;position:relative;margin:0;padding:5px 8px 5px 18px;
  border-bottom:1px dashed #cde9d8;line-height:1.45;overflow-wrap:anywhere;font-weight:400;color:#2f5a45}
.summary>.ok .err-item:last-child{border-bottom:0}
.summary>.ok .err-item::before{content:"";position:absolute;left:5px;top:11px;width:5px;height:5px;
  border-radius:50%;background:#12a150}
.summary>.ok .err-item b{display:inline-block;margin-right:6px;padding:0 5px;border-radius:4px;
  background:#e3f6ea;color:#0f7a43;font-size:10px;font-weight:800}
.summary>.ok .err-item .path{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
  font-size:10px;color:#3c6b55}
.summary>.ok::before{content:"\2713";display:inline-grid;place-items:center;width:14px;height:14px;margin-right:7px;
  border-radius:50%;background:#12a150;color:#fff;font-size:10px;line-height:1;vertical-align:1px}
.foot{flex:none;display:flex;justify-content:flex-end;margin-top:auto;padding-top:10px;gap:18px}.foot>.hint{display:none}
</style>
</head>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var addr = $("address"), browse = $("browse"), start = $("start"),
      dot = $("dot"),
      statustext = $("statustext"),
      bar = $("progressBar"),
      pv = $("progressValue"), pt = $("progressText"), logEl = $("log"),
      sumEl = $("summary"), errEl = $("errbox"), hint = $("hint"),
      loghint = $("loghint"), language = $("language"),
      diagbtn = $("diagbtn"),
      steps = [$("s0"), $("s1"), $("s2")].filter(function (el) { return !!el; }),
      quitBtn = $("quit"), brand = $("brand"), topnote = $("topnote"),
      languageLabel = $("languageLabel"),
      eyebrow = $("eyebrow"), heading = $("heading"),
      optIgnore = $("optIgnoreDisabled"), optClean = $("optCleanStale"),
      optIgnoreLabel = $("optIgnoreDisabledLabel"), optCleanLabel = $("optCleanStaleLabel");

  var STEPS_FALLBACK = {
    config: ["① 检查面板本体", "② 扫描并写入面板目录", "③ 复核改动范围"]
  };
  var job = null, phaseLabel = null;

  var running = false, lastLogLen = 0, primed = false;
  var lastSummary = null;
  var currentLanguage = "en", lastState = "idle";
  // A local error (bad path, offline, quit failure) is shown immediately from
  // the API response, before the backend state machine ever enters "error".
  // The poll must not clear it just because state is still "idle" -- that made
  // the red box flash for one frame. It persists until the next real run or a
  // backend "done"/"error" state takes over.
  var stickyError = "";

  function showError(text) {
    stickyError = text || "";
    if (errEl) {
      errEl.textContent = stickyError ? "✗ " + stickyError : "";
      errEl.className = stickyError ? "errbox show" : "errbox";
    }
  }

  function api(path, body) {
    return fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }

  function reportJs(msg, src, line, stack) {
    try {
      api("/api/js-error", {
        msg: String(msg || "").slice(0, 400),
        src: String(src || "").slice(0, 200),
        line: line || 0,
        stack: String(stack || "").slice(0, 1500)
      }).catch(function () {});
    } catch (_) {}
  }
  window.addEventListener("error", function (e) {
    reportJs(e.message || "error", e.filename, e.lineno,
             e.error && e.error.stack);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    reportJs("unhandledrejection: " + (r && r.message ? r.message : String(r)),
             "", 0, r && r.stack);
  });

  function showBox(text) {
    if (!errEl) return;
    errEl.textContent = text || "";
    errEl.className = "errbox" + (text ? " show" : "");
  }

  function copyText(s) {
    function legacy() {
      try {
        var ta = document.createElement("textarea");
        ta.value = s;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (_) { return false; }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(s).then(
          function () { return true; },
          function () { return legacy(); });
      }
    } catch (_) {}
    return Promise.resolve(legacy());
  }

  if (diagbtn) diagbtn.onclick = function () {
    var t = LANG[currentLanguage] || LANG["zh-CN"];
    diagbtn.disabled = true;
    diagbtn.textContent = t.diagBusy;
    api("/api/diag-bundle", { mods: (addr && addr.value) || "" })
      .then(function (r) {
        diagbtn.disabled = false;
        diagbtn.textContent = t.diag;
        if (!r || !r.ok) {
          showBox("✗ " + ((r && r.error) || "?"));
          return;
        }
        copyText(r.summary || "").then(function (ok) {
          showBox((ok ? t.diagCopied + " " : "") + t.diagDone + r.path);

      // as "mod" in every locale; the reason lives here rather than the Go
      // payload, which is shared verbatim with every language.
      var inactiveLabel = {"zh-CN":"个角色的 mod 已改名或缺失（不再生效）","zh-TW":"個角色的 mod 已改名或缺失（不再生效）",en:" characters' mod renamed or missing (no longer active)",ja:"のキャラクターの mod が改名済みまたは見つからない（無効）",ko:" 캐릭터의 mod 이름 변경 또는 누락 (더 이상 적용 안 됨)"}[currentLanguage] || " characters' mod renamed or missing (no longer active)";
      inactive = inactive.replace(/^(\d+)\s*个角色的 mod 未加载/, "$1" + inactiveLabel);
      inactive = localizeNames(inactive);
      rows.push(summaryRow(inactive));
    }
    if (y.skipped) {
      // Deliberate _skipemote opt-outs are NOT failures. The subject is the
      // mod the user marked, not the character that owns it; keep this
      // wording neutral so a correct opt-out is never reported as an error.
      var skipped = String(y.skipped);
      var skippedLabel = {"zh-CN":"个角色的 mod 按 _skipemote 跳过","zh-TW":"個角色的 mod 依 _skipemote 略過",en:" characters' mod skipped by _skipemote",ja:"のキャラクターの mod が _skipemote でスキップ",ko:" 캐릭터의 mod가 _skipemote로 건너뜀"}[currentLanguage] || " characters' mod skipped by _skipemote";
      skipped = skipped.replace(/^(\d+)\s*个角色的 mod 按 _skipemote 跳过/, "$1" + skippedLabel);
      skipped = localizeNames(skipped);
      rows.push(summaryRow(skipped));
    }
    return rows.join("") || summaryRow(r.done);
  }

  var pollTimer = null;

  function schedulePoll(delay) {
    if (pollTimer !== null) clearTimeout(pollTimer);
    pollTimer = setTimeout(function () {
      pollTimer = null;
      poll();
    }, delay);
  }

  function poll() {
    api("/api/status").then(function (s) {
      if (!primed) {
        primed = true;
        // First poll only: refill the folder from the last successful run.
        // savedMods() already drops a stale path, so a remembered value is
        // always one that existed -- the box is empty only on a true first
        // run. Do not move this into apply(): a later poll must never
        // overwrite the path the user is typing.
        if (!addr.value && s.last_mods) addr.value = s.last_mods;
        hint.textContent = s.root_ok ? "" : (LANG[currentLanguage] || LANG["zh-CN"]).root;

        if (s.log_path) loghint.textContent = (LANG[currentLanguage] || LANG["zh-CN"]).log + s.log_path;
      }
      apply(s);

      schedulePoll(running ? 250 : 1200);
    }).catch(function () {

      var msg = (LANG[currentLanguage] || LANG["zh-CN"]).disconnected;
      if (dot) dot.className = "dot err";
      if (statustext) statustext.textContent = msg;
      if (pt) pt.textContent = msg;
      schedulePoll(1500);
    });
  }

  // ---- address bar: drop a folder ----------------------------------
  // Chromium hides absolute paths from the DOM, so the drop is handed to the
  // WebView2 host through postMessageWithAdditionalObjects; the host replies
  // by calling window.onNativeDrop(realPaths). Only folders are accepted.
  var dropWrap = addr ? addr.parentNode : null;
  var dropDepth = 0;

  function dropHint(text, warn) {
    if (!hint) return;
    hint.className = "hint" + (warn ? " warn" : "");
    hint.textContent = text || "";
  }

  window.onNativeDrop = function (paths) {
    if (dropWrap) dropWrap.classList.remove("dragover");
    if (!paths || !paths.length) {
      dropHint((LANG[currentLanguage] || LANG["zh-CN"]).dropFail, true);
      return;
    }
    addr.value = paths[0];
    dropHint("");
  };

  if (addr && dropWrap) {
    dropWrap.addEventListener("dragenter", function (e) {
      e.preventDefault(); e.stopPropagation();
      dropDepth++; dropWrap.classList.add("dragover");
    });
    dropWrap.addEventListener("dragover", function (e) {
      e.preventDefault(); e.stopPropagation();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
    });
    dropWrap.addEventListener("dragleave", function (e) {
      e.preventDefault(); e.stopPropagation();
      dropDepth = Math.max(0, dropDepth - 1);
      if (!dropDepth) dropWrap.classList.remove("dragover");
    });
    dropWrap.addEventListener("drop", function (e) {
      e.preventDefault(); e.stopPropagation();
      dropDepth = 0; dropWrap.classList.remove("dragover");
      // WebView2 does not reliably populate webkitGetAsEntry() for folders
      // dragged from Explorer, so never gate the drop on it. Hand every
      // dropped File to the native bridge, which resolves real disk paths
      // through ICoreWebView2File.Path. resolveMods() rejects bad paths later.
      var files = e.dataTransfer && e.dataTransfer.files;
      var cw = window.chrome && window.chrome.webview;
      if (!files || !files.length || !cw || !cw.postMessageWithAdditionalObjects) {
        dropHint((LANG[currentLanguage] || LANG["zh-CN"]).dropNoBridge, true);
        return;
      }
      dropHint((LANG[currentLanguage] || LANG["zh-CN"]).dropReading || "");
      try {
        cw.postMessageWithAdditionalObjects("__wwemote_drop__", files);
      } catch (_) {
        dropHint((LANG[currentLanguage] || LANG["zh-CN"]).dropNoBridge, true);
      }
    });
  }

  // A folder dropped ANYWHERE outside the address bar must never reach
  // Chromium's default file-navigation handler: WebView2 tries to render the
  // folder as a file:// directory and a giant white page covers the panel.
  // The dropWrap handlers above stopPropagation for the address bar itself, so
  // anything that reaches document here is outside the bar -> swallow it.
  // The contains() check is a belt-and-braces guard in case propagation ever
  // changes: drags genuinely over the bar keep working.
  function inDropWrap(t) {
    return !!(dropWrap && t && (t === dropWrap || dropWrap.contains(t)));
  }
  ["dragenter", "dragover", "dragleave", "drop"].forEach(function (type) {
    // Capture phase: run before any region handler can stop propagation.
    document.addEventListener(type, function (e) {
      if (inDropWrap(e.target)) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "none";
    }, true);
  });

  browse.onclick = function () {
    browse.disabled = true;
    hint.className = "hint";
    hint.textContent = "";
    api("/api/pick-folder", { initial: addr.value || "" }).then(function (r) {
      browse.disabled = false;
      if (r && r.path) { addr.value = r.path; return; }

      hint.className = "hint warn";
      var t = LANG[currentLanguage] || LANG["zh-CN"];
      hint.textContent = t.noDialog
        + (r && r.error ? "（" + r.error + "）" : "")
        + "，" + t.paste;
      addr.focus();
    }).catch(function () {
      browse.disabled = false;
      hint.className = "hint warn";
      hint.textContent = (LANG[currentLanguage] || LANG["zh-CN"]).noBackend;
      addr.focus();
    });
  };

  function runJob() {
    if (!addr.value.trim()) { addr.focus(); return; }
    if (sumEl) sumEl.className = "summary";
    lastSummary = null;
    stickyError = "";
    if (errEl) errEl.className = "errbox";
    lastLogLen = 0; if (logEl) logEl.textContent = "";
    job = "config"; setStepText(job);
    setBusy(true, job, "running");
    api("/api/start", {
      mods: addr.value,
      ignore_disabled: !!(optIgnore && optIgnore.checked),
      clean_stale: !!(optClean && optClean.checked)
    }).then(function (r) {
      if (!r.ok) {
        showError(r.error);
        setBusy(false, job, "error");
      }
    }).catch(function (e) {
      showError((LANG[currentLanguage] || LANG["en"]).offline + e);
      setBusy(false, job, "error");
    });
  }

  if (start) start.onclick = function () { runJob(); };

  addr.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !running) start.click();
  });

  if (quitBtn) quitBtn.onclick = function () {
    quitBtn.disabled = true;
    api("/api/quit", {}).catch(function (e) {
      quitBtn.disabled = false;
      showError((LANG[currentLanguage] || LANG["en"]).closeFail + e);
    });
  };

  if (language) {
    var savedLanguage = "en";
    try { savedLanguage = localStorage.getItem("wwemote-language") || localStorage.getItem("wuwaemote-language") || savedLanguage; } catch (_) {}
    if (LANG[savedLanguage]) language.value = savedLanguage;
    language.onchange = function () {
      applyLanguage(language.value);
      api("/api/language", { language: language.value }).catch(function () {});
    };
    applyLanguage(language.value || savedLanguage);

    api("/api/language").then(function (r) {
      if (r && LANG[r.language]) {
        language.value = r.language;
        applyLanguage(r.language);
      }
    }).catch(function () {});
  }

  // Checkbox choices are remembered locally, like the language. Restore on
  // load and save on change; a missing/denied localStorage is non-fatal.
  var OPT_KEY_IGNORE = "wwemote-ignore-disabled", OPT_KEY_STALE = "wwemote-clean-stale";
  function restoreChecks() {
    try {
      if (optIgnore && localStorage.getItem(OPT_KEY_IGNORE) === "1") optIgnore.checked = true;
      if (optClean && localStorage.getItem(OPT_KEY_STALE) === "1") optClean.checked = true;
    } catch (_) {}
  }
  if (optIgnore) optIgnore.addEventListener("change", function () {
    try { localStorage.setItem(OPT_KEY_IGNORE, optIgnore.checked ? "1" : "0"); } catch (_) {}
  });
  if (optClean) optClean.addEventListener("change", function () {
    try { localStorage.setItem(OPT_KEY_STALE, optClean.checked ? "1" : "0"); } catch (_) {}
  });
  restoreChecks();

  // Vertical-only window resize: the top/bottom strips call the Go binding
  // with the edge and the pointer delta. screenY is used (not clientY) so the
  // delta stays correct even after the window has moved under the cursor.
  // Width is never touched by resizeHeight on the Go side.
  (function () {
    var top = $("resizeTop"), bottom = $("resizeBottom");
    var active = null;
    function start(edge) {
      return function (e) {
        if (e.button !== 0 || !window.resizeHeight) return;
        e.preventDefault();
        try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch (_) {}
        active = { edge: edge, y: e.screenY };
      };
    }
    function move(e) {
      if (!active || !window.resizeHeight) return;
      e.preventDefault();
      // screenY is in CSS pixels; Win32 SetWindowPos works in physical pixels.
      var dpr = window.devicePixelRatio || 1;
      window.resizeHeight(active.edge, Math.round((e.screenY - active.y) * dpr));
      active.y = e.screenY;
    }
    function end() {
      if (!active) return;
      active = null;
      if (window.commitWindowHeight) window.commitWindowHeight().catch(function () {});
    }
    [top, bottom].forEach(function (el) {
      if (!el) return;
      el.addEventListener("mousedown", start(el === top ? "top" : "bottom"));
      el.addEventListener("pointerdown", start(el === top ? "top" : "bottom"));
    });
    window.addEventListener("mousemove", move);
    window.addEventListener("pointermove", move);
    window.addEventListener("mouseup", end);
    window.addEventListener("pointerup", end);
  })();

  setStepText("config");
  poll();
})();
</script>
</body>
</html>
