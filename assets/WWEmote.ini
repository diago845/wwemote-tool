; EP-PANEL-SIGNATURE = WWEmote
; EP-PANEL-VERSION = 1.5.5

namespace = WWEmote

[Constants]

; ---- WINDOW / ASPECT ----
global $ep_ww = 1920
global $ep_wh = 1080
global $ep_ar = 1.7778

; ---- PANEL TOGGLE (KEY 5) ----
global $ep_show = 0

; ---- ADAPT GATE ----
global $ep_adapt_now = 0

; ---- CURSOR ----
global $ep_cx = 0.5
global $ep_cy = 0.5

; ---- MOUSE ----
global $ep_mouse_down = 0
global $ep_mouse_prev = 0
global $ep_mouse_edge = 0

; ---- WHEEL GEOMETRY ----
global $ep_disk_d = 0.1875
global $ep_hole_d = 0.07291667
global $ep_tok_s  = 0.04010417
global $ep_ro2    = 0.0087890625
global $ep_ri2    = 0.00132921007
global $ep_t22    = 0.414214
global $ep_t67    = 2.414214
global $ep_disk_cx = 0.7604167
global $ep_disk_cy = 0.4074074
global $ep_repo_cell = 0.03333333
global $ep_repo_w = 0.2666667
global $ep_repo_h = 0.1333333
global $ep_repo_slot = 4
global $ep_bbox_hw = 0.1333333
global $ep_bbox_up = 0.140625
global $ep_bbox_dn = 0.23125
global $ep_disk_n = 8
global $ep_repo_n = 32
global $ep_repo_cols = 8
global $ep_repo_rows = 4
global $ep_repo_pitch = 0.03333333
global $ep_repo_l = -0.1333333
global $ep_repo_t = 0.09791667
global $ep_av_l = -0.01875
global $ep_av_t = -0.140625
global $ep_av_r = 0.01875
global $ep_av_b = -0.103125
global $ep_av_s = 0.0375
global $ep_bd_s = 0.01145833

; ---- SLOT / SHELF CONTENT ----
; ---- WHEEL SLOTS 0..7 ----
global persist $ep_slot0 = 0
global persist $ep_slot1 = -1
global persist $ep_slot2 = -1
global persist $ep_slot3 = -1
global persist $ep_slot4 = -1
global persist $ep_slot5 = 1
global persist $ep_slot6 = -1
global persist $ep_slot7 = -1

; ---- SHELF CELLS 0..31 ----
global persist $ep_repo0 = 0
global persist $ep_repo1 = 1
global persist $ep_repo2 = -1
global persist $ep_repo3 = -1
global persist $ep_repo4 = -1
global persist $ep_repo5 = -1
global persist $ep_repo6 = -1
global persist $ep_repo7 = -1
global persist $ep_repo8 = -1
global persist $ep_repo9 = -1
global persist $ep_repo10 = -1
global persist $ep_repo11 = -1
global persist $ep_repo12 = -1
global persist $ep_repo13 = -1
global persist $ep_repo14 = -1
global persist $ep_repo15 = -1
global persist $ep_repo16 = -1
global persist $ep_repo17 = -1
global persist $ep_repo18 = -1
global persist $ep_repo19 = -1
global persist $ep_repo20 = -1
global persist $ep_repo21 = -1
global persist $ep_repo22 = -1
global persist $ep_repo23 = -1
global persist $ep_repo24 = -1
global persist $ep_repo25 = -1
global persist $ep_repo26 = -1
global persist $ep_repo27 = -1
global persist $ep_repo28 = -1
global persist $ep_repo29 = -1
global persist $ep_repo30 = -1
global persist $ep_repo31 = -1

; ---- HIT AREA TEMPS ----
global $ep_src_repo = 0
global $ep_tgt_repo = 0

; ---- DRAG STATE (FLAT INDEX) ----
global $ep_g_idx = -1
global $ep_g_val = -1
global $ep_s_idx = -1
global $ep_s_val = -1
global $ep_press_repo = -1
global $ep_press_flat = -1
global $ep_src_flat = -1
global $ep_tgt_flat = -1
global $ep_tgt_tok = -1

; ---- HOVER FLAT INDEX ----
global $ep_hov_flat = -1

; ---- SHAPEKEY CHANNEL: CUR / UNDO / LAST ----
global $ep_k_cur = 0
global $ep_k_off = 0
global $ep_k_prev = -1

; ---- SHELF HIT TEMP ----
global $ep_rx = 0
global $ep_ry = 0
global $ep_rc = 0
global $ep_rr = 0
global $ep_repo_hit = -1

; ---- POLAR HIT TEMP ----
global $ep_ux = 0
global $ep_uy = 0
global $ep_r2 = 0
global $ep_ax = 0
global $ep_ay = 0

; ---- HOVER / SELECT / ACTIVE ----
global $ep_hover = -1
global $ep_sel = -1
global persist $ep_act_tok = -1
global $ep_bind_tok = -1
; ---- CLEAR KEY (NUMPAD 7) ----
global $ep_clear_hold = 0

; ---- HSIN DELTA ----

; ---- SHELF EXTENDED ----
global $ep_repo_open = 0
global $ep_page = 0

; ---- MOUSE FSM (STEP 3) ----
global $ep_hold_need   = 18
global $ep_move_norm   = 0.003125
global $ep_ghost_scale = 1.25
global $ep_mouse_live = 0
global $ep_cursor_ok = 0
global $ep_hold_frames = 0
global $ep_moved = 0
global $ep_press_cx = 0.5
global $ep_press_cy = 0.5
global $ep_press_slot = -1
global $ep_grab_dx = 0
global $ep_grab_dy = 0
global $ep_dragging_disk = 0
global $ep_dragging_token = 0
global $ep_drag_tok = -1

; ---- CANARY ----
global $ep_canary = 0.9

; ---- PHASE B: BAKE (ROUTE R) ----
global $ep_r_on = 1

; ---- P3-FIX2 TELEMETRY ----
global persist $ep_r_dbg = 2

; ---- CHAR PRESENCE (STEP 18) ----

; ---- 2 STATE SAVE ----

; ---- FALLBACK UAV (NO MOD) ----
[ResourceEpDummyU5]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 64

[KeyEpShow]
key = no_modifiers 5
type = cycle
condition = $ep_adapt_now
$ep_show = 1, 0

[KeyEpClear]
key = no_modifiers 7
type = hold
$ep_clear_hold = 1

[KeyEpMouseLeft]
key = VK_LBUTTON
type = hold
condition = $ep_show
$ep_mouse_down = 1

; ---- CYCLE CHAR KEY ----

[KeyEpNativeToggle]
key = no_modifiers 6
type = hold
$ep_nat_toggle_req = 1

[Present]
$ep_adapt_now = 0
run = CommandListEpAdaptProbe
if $ep_adapt_now <= 0
    $ep_show = 0
endif

if $ep_clear_hold > 0
    $ep_act_tok = -1
endif
if $ep_show
    if $ep_chr_any
        run = CommandListEpCharFrame
        run = CommandListEpFrame
        run = CommandListEpKeepSync
    endif
elif $ep_clear_hold > 0
    if $ep_adapt_now > 0
        run = CommandListEpBridgeSingle
        run = CommandListEpResolveRecipe
    endif
endif

run = CommandListEpCharReset
run = CommandListEpGlobalReset
run = CommandListEpResetSuisui
run = CommandListEpResetHsin
run = CommandListEpResetHsinult

[CommandListEpAdaptProbe]
run = CommandListEpAdaptProbeSuisui
run = CommandListEpAdaptProbeHsin
run = CommandListEpAdaptProbeHsinult
[CommandListEpKeepSync]
run = CommandListEpKeepSyncSuisui
run = CommandListEpKeepSyncHsin
run = CommandListEpKeepSyncHsinult

[CommandListEpFrame]

; ---- 1 WINDOWSIZE FALLBACK ----
if window_width >= 640
    $ep_ww = window_width
    $ep_wh = window_height
elif rt_width >= 640
    $ep_ww = rt_width
    $ep_wh = rt_height
else
    $ep_ww = res_width
    $ep_wh = res_height
endif
$ep_ar = $ep_ww / $ep_wh

; ---- 2 CURSOR POS / VALID ----
$ep_cx = cursor_x
$ep_cy = cursor_y
$ep_cursor_ok = cursor_showing

; ---- 3 PANEL DRAG ----
if $ep_dragging_disk > 0
    $ep_disk_cx = $ep_cx + $ep_grab_dx
    $ep_disk_cy = $ep_cy + $ep_grab_dy
    if $ep_disk_cx < $ep_bbox_hw
        $ep_disk_cx = $ep_bbox_hw
    endif
    if $ep_disk_cx > 1 - $ep_bbox_hw
        $ep_disk_cx = 1 - $ep_bbox_hw
    endif
    if $ep_disk_cy < $ep_bbox_up * $ep_ar
        $ep_disk_cy = $ep_bbox_up * $ep_ar
    endif
    if $ep_disk_cy > 1 - $ep_bbox_dn * $ep_ar
        $ep_disk_cy = 1 - $ep_bbox_dn * $ep_ar
    endif
endif

; ---- 4 EDGE DETECT ----
$ep_mouse_edge = 0
if $ep_mouse_down > 0
    if $ep_mouse_prev <= 0
        $ep_mouse_edge = 1
    endif
endif

; ---- 5 HIT TEST (POLAR) ----
$ep_ux = $ep_cx - $ep_disk_cx
$ep_uy = ($ep_cy - $ep_disk_cy) / $ep_ar
$ep_r2 = $ep_ux * $ep_ux + $ep_uy * $ep_uy

$ep_hover = -1
if $ep_r2 > $ep_ri2
    if $ep_r2 < $ep_ro2
        $ep_ax = $ep_ux
        if $ep_ax < 0
            $ep_ax = 0 - $ep_ax
        endif
        $ep_ay = $ep_uy
        if $ep_ay < 0
            $ep_ay = 0 - $ep_ay
        endif
        if $ep_ay <= $ep_ax * $ep_t22
            if $ep_ux > 0
                $ep_hover = 2
            else
                $ep_hover = 6
            endif
        elif $ep_ay >= $ep_ax * $ep_t67
            if $ep_uy > 0
                $ep_hover = 4
            else
                $ep_hover = 0
            endif
        else
            if $ep_ux > 0
                if $ep_uy > 0
                    $ep_hover = 3
                else
                    $ep_hover = 1
                endif
            else
                if $ep_uy > 0
                    $ep_hover = 5
                else
                    $ep_hover = 7
                endif
            endif
        endif
    endif
endif

; ---- 5A AVATAR HIT ----
$ep_av_hover = 0
if $ep_chr_n >= 2
    if $ep_ux >= $ep_av_l
        if $ep_ux <= $ep_av_l + $ep_av_s
            if $ep_uy >= $ep_av_t
                if $ep_uy <= $ep_av_t + $ep_av_s
                    $ep_av_hover = 1
                endif
            endif
        endif
    endif
endif

; ---- 5A2 AVATAR CLICK PULSE ----
$ep_av_click = 0
if $ep_mouse_edge > 0 && $ep_av_hover > 0
    $ep_av_click = 1
endif

; ---- 5B SHELF HIT ----
$ep_repo_hit = -1
if $ep_repo_open > 0
    $ep_rx = $ep_ux + 0.133333333
    $ep_ry = $ep_uy - 0.097916667
    if $ep_rx >= 0
        if $ep_ry >= 0
            if $ep_rx < $ep_repo_w
                if $ep_ry < $ep_repo_h
                    $ep_rc = 0
                    if $ep_rx >= $ep_repo_pitch * 7
                        $ep_rc = 7
                    elif $ep_rx >= $ep_repo_pitch * 6
                        $ep_rc = 6
                    elif $ep_rx >= $ep_repo_pitch * 5
                        $ep_rc = 5
                    elif $ep_rx >= $ep_repo_pitch * 4
                        $ep_rc = 4
                    elif $ep_rx >= $ep_repo_pitch * 3
                        $ep_rc = 3
                    elif $ep_rx >= $ep_repo_pitch * 2
                        $ep_rc = 2
                    elif $ep_rx >= $ep_repo_pitch * 1
                        $ep_rc = 1
                    endif
                    $ep_rr = 0
                    if $ep_ry >= $ep_repo_pitch * 3
                        $ep_rr = 3
                    elif $ep_ry >= $ep_repo_pitch * 2
                        $ep_rr = 2
                    elif $ep_ry >= $ep_repo_pitch * 1
                        $ep_rr = 1
                    endif
                    $ep_repo_hit = $ep_rr * $ep_repo_cols + $ep_rc
                endif
            endif
        endif
    endif
endif

; ---- 6 DUAL STATE MACHINE ----
$ep_mouse_live = 0
if $ep_mouse_down > 0
    if $ep_cursor_ok > 0
        $ep_mouse_live = 1
    endif
endif

; ---- 6A PRESS BASELINE ----
if $ep_mouse_edge > 0
    $ep_press_cx = $ep_cx
    $ep_press_cy = $ep_cy
    $ep_press_slot = $ep_hover
    $ep_press_repo = $ep_repo_hit
    $ep_hold_frames = 0
    $ep_moved = 0
endif

; ---- 6B HOLD FRAMES / MOVE ----
if $ep_mouse_live > 0
    $ep_hold_frames = $ep_hold_frames + 1
    if $ep_cx - $ep_press_cx > $ep_move_norm
        $ep_moved = 1
    endif
    if $ep_press_cx - $ep_cx > $ep_move_norm
        $ep_moved = 1
    endif
    if ($ep_cy - $ep_press_cy) / $ep_ar > $ep_move_norm
        $ep_moved = 1
    endif
    if ($ep_press_cy - $ep_cy) / $ep_ar > $ep_move_norm
        $ep_moved = 1
    endif
endif

; ---- 6C LONGPRESS GRAB ----
if $ep_mouse_live > 0 && $ep_av_hover <= 0
    if $ep_dragging_disk <= 0
        if $ep_dragging_token <= 0
            if $ep_moved <= 0
                if $ep_hold_frames >= $ep_hold_need
                    if $ep_r2 <= $ep_ro2
                        $ep_dragging_disk = 1
                        $ep_grab_dx = $ep_disk_cx - $ep_cx
                        $ep_grab_dy = $ep_disk_cy - $ep_cy
                    endif
                endif
            endif
        endif
    endif
endif

; ---- 6D SHORTDRAG LIFT ----
if $ep_mouse_live > 0 && $ep_av_hover <= 0
    if $ep_dragging_disk <= 0
        if $ep_dragging_token <= 0
            if $ep_moved > 0
                $ep_press_flat = -1
                if $ep_press_slot >= 0
                    if $ep_press_slot != $ep_repo_slot
                        $ep_press_flat = $ep_press_slot
                    endif
                endif
                if $ep_press_repo >= 0
                    $ep_press_flat = $ep_disk_n + $ep_press_repo
                endif
                $ep_g_idx = $ep_press_flat
                run = CommandListEpGetSlot
                $ep_drag_tok = $ep_g_val
                $ep_src_flat = $ep_press_flat
                $ep_src_repo = 0
                if $ep_src_flat >= $ep_disk_n
                    $ep_src_repo = 1
                endif
                if $ep_drag_tok >= 0
                    $ep_dragging_token = 1
                endif
            endif
        endif
    endif
endif

; ---- 5C DROP RESOLVE (AFTER 6D) ----
$ep_tgt_flat = -1
if $ep_dragging_token > 0
    if $ep_hover >= 0
        if $ep_hover != $ep_repo_slot
            $ep_tgt_flat = $ep_hover
        endif
    endif
    if $ep_repo_hit >= 0
        $ep_tgt_flat = $ep_disk_n + $ep_repo_hit
    endif
    $ep_g_idx = $ep_tgt_flat
    run = CommandListEpGetSlot
    $ep_tgt_tok = $ep_g_val
endif

; ---- 6E RELEASE / EXIT ----
if $ep_dragging_disk > 0
    if $ep_mouse_down <= 0
        $ep_dragging_disk = 0
    endif
endif
if $ep_dragging_token > 0
    if $ep_mouse_down <= 0
        ; ---- DROP APPLY ----
        if $ep_tgt_flat >= 0
            $ep_tgt_repo = 0
            if $ep_tgt_flat >= $ep_disk_n
                $ep_tgt_repo = 1
            endif
            if $ep_tgt_repo <= 0
                if $ep_src_repo <= 0
                    ; ---- 1 WHEEL TO WHEEL: SWAP ----
                    $ep_s_idx = $ep_tgt_flat
                    $ep_s_val = $ep_drag_tok
                    run = CommandListEpSetSlot
                    $ep_s_idx = $ep_src_flat
                    $ep_s_val = $ep_tgt_tok
                    run = CommandListEpSetSlot
                else
                    ; ---- 3 SHELF TO WHEEL: PLACE (KEEP SRC) ----
                    if $ep_slot0 == $ep_drag_tok
                        $ep_slot0 = -1
                    endif
                    if $ep_slot1 == $ep_drag_tok
                        $ep_slot1 = -1
                    endif
                    if $ep_slot2 == $ep_drag_tok
                        $ep_slot2 = -1
                    endif
                    if $ep_slot3 == $ep_drag_tok
                        $ep_slot3 = -1
                    endif
                    if $ep_slot4 == $ep_drag_tok
                        $ep_slot4 = -1
                    endif
                    if $ep_slot5 == $ep_drag_tok
                        $ep_slot5 = -1
                    endif
                    if $ep_slot6 == $ep_drag_tok
                        $ep_slot6 = -1
                    endif
                    if $ep_slot7 == $ep_drag_tok
                        $ep_slot7 = -1
                    endif

                    $ep_s_idx = $ep_tgt_flat
                    $ep_s_val = $ep_drag_tok
                    run = CommandListEpSetSlot
                endif
            else
                if $ep_src_repo <= 0
                    ; ---- 2 WHEEL TO SHELF: UNSLOT ----
                    $ep_s_idx = $ep_src_flat
                    $ep_s_val = -1
                    run = CommandListEpSetSlot
                endif
                ; ---- 4 SHELF TO SHELF: NOOP ----
            endif
        endif
        $ep_dragging_token = 0
        $ep_drag_tok = -1
        $ep_src_flat = -1
        $ep_tgt_flat = -1
        $ep_tgt_tok = -1
    endif
endif
if $ep_cursor_ok <= 0
    $ep_dragging_disk = 0
    $ep_dragging_token = 0
    $ep_drag_tok = -1
    $ep_src_flat = -1
    $ep_tgt_flat = -1
    $ep_tgt_tok = -1
endif

; ---- 6F CLICK: OPEN/CLOSE SHELF ----
if $ep_mouse_prev > 0
    if $ep_mouse_down <= 0
        if $ep_moved <= 0
            if $ep_hold_frames < $ep_hold_need
                if $ep_press_slot == $ep_repo_slot
                    $ep_repo_open = 1 - $ep_repo_open
                endif
            endif
        endif
    endif
endif

; ---- 11 CURSOR TO ITEM TO CHANNEL ----
$ep_hov_flat = -1
if $ep_hover >= 0
    $ep_hov_flat = $ep_hover
elif $ep_repo_hit >= 0
    $ep_hov_flat = $ep_disk_n + $ep_repo_hit
endif
$ep_g_idx = $ep_hov_flat
run = CommandListEpGetSlot
if $ep_g_val >= 0
    $ep_act_tok = $ep_g_val
endif

; ---- FEED K-CHANNELS ----
run = CommandListEpResolveRecipe

; ---- 11B SHAPEKEY CHANNEL ----
run = CommandListEpBridgeSingle

; ---- 6G TRANSITION DEC ----
if $ep_av_flash > 0
    $ep_av_flash = $ep_av_flash - 1
endif

; ---- 7 DRAW ----
run = CommandListEpDrawPanel

; ---- 8 CLEAR IniParams[87..90] ----
x87 = 0
y87 = 0
z87 = 0
w87 = 0

; ---- 9 TEXT ----

; ---- 10 SAVE PRESS STATE ----
$ep_mouse_prev = $ep_mouse_down

[CommandListEpBindToken]
if $ep_bind_tok == 40
    ps-t100 = ResourceEpTok040
elif $ep_bind_tok == 41
    ps-t100 = ResourceEpTok041
elif $ep_bind_tok == 0
    ps-t100 = ResourceEpTok000
elif $ep_bind_tok == 1
    ps-t100 = ResourceEpTok001
elif $ep_bind_tok == 2
    ps-t100 = ResourceEpTok002
elif $ep_bind_tok == 3
    ps-t100 = ResourceEpTok003
elif $ep_bind_tok == 4
    ps-t100 = ResourceEpTok004
elif $ep_bind_tok == 5
    ps-t100 = ResourceEpTok005
elif $ep_bind_tok == 6
    ps-t100 = ResourceEpTok006
elif $ep_bind_tok == 7
    ps-t100 = ResourceEpTok007
elif $ep_bind_tok == 8
    ps-t100 = ResourceEpTok008
elif $ep_bind_tok == 9
    ps-t100 = ResourceEpTok009
elif $ep_bind_tok == 10
    ps-t100 = ResourceEpTok010
elif $ep_bind_tok == 11
    ps-t100 = ResourceEpTok011
elif $ep_bind_tok == 12
    ps-t100 = ResourceEpTok012
elif $ep_bind_tok == 13
    ps-t100 = ResourceEpTok013
elif $ep_bind_tok == 14
    ps-t100 = ResourceEpTok014
elif $ep_bind_tok == 15
    ps-t100 = ResourceEpTok015
elif $ep_bind_tok == 16
    ps-t100 = ResourceEpTok016
elif $ep_bind_tok == 17
    ps-t100 = ResourceEpTok017
elif $ep_bind_tok == 18
    ps-t100 = ResourceEpTok018
elif $ep_bind_tok == 19
    ps-t100 = ResourceEpTok019
elif $ep_bind_tok == 20
    ps-t100 = ResourceEpTok020
elif $ep_bind_tok == 21
    ps-t100 = ResourceEpTok021
elif $ep_bind_tok == 22
    ps-t100 = ResourceEpTok022
elif $ep_bind_tok == 23
    ps-t100 = ResourceEpTok023
elif $ep_bind_tok == 24
    ps-t100 = ResourceEpTok024
elif $ep_bind_tok == 25
    ps-t100 = ResourceEpTok025
elif $ep_bind_tok == 26
    ps-t100 = ResourceEpTok026
elif $ep_bind_tok == 27
    ps-t100 = ResourceEpTok027
elif $ep_bind_tok == 28
    ps-t100 = ResourceEpTok028
elif $ep_bind_tok == 29
    ps-t100 = ResourceEpTok029
elif $ep_bind_tok == 30
    ps-t100 = ResourceEpTok030
elif $ep_bind_tok == 31
    ps-t100 = ResourceEpTok031
elif $ep_bind_tok == 32
    ps-t100 = ResourceEpTok032
elif $ep_bind_tok == 33
