; ---- MAIN: 0 LATCH RESET ----
[CommandListEpGlobalReset]
$\WWMIv1\shapekey_dispatch_size_y_original_batch0 = 0

; ---- CHARS: 2 PRESENCE ----
[CommandListEpCharReset]
$ep_chr_any = 0
$ep_chr_n = 0

; ---- CHARS: 3 FRAME LOGIC ----
[CommandListEpCharFrame]

$ep_switch_edge = 0
if $ep_switch_req > 0
    if $ep_switch_prev <= 0
        $ep_switch_edge = 1
    endif
endif
if $ep_av_click > 0
    $ep_switch_edge = 1
endif

$ep_chr_id = -1
if $ep_chr_any > 0
    if $ep_chr_prev >= 0
        if $ep_chr_prev == 0 && $ep_chr_suisui > 0
            $ep_chr_id = $ep_chr_prev
        elif $ep_chr_prev == 3 && $ep_chr_hsin > 0
            $ep_chr_id = $ep_chr_prev
        elif $ep_chr_prev == 4 && $ep_chr_hsinult > 0
            $ep_chr_id = $ep_chr_prev
        endif
    endif
endif
if $ep_switch_edge > 0
    if $ep_chr_any > 0
        $ep_next_ok = 0
        $ep_from = $ep_chr_id
        if $ep_next_ok < 1 && $ep_from < 0
            if $ep_chr_suisui > 0
                $ep_chr_id = 0
                $ep_next_ok = 1
            endif
        endif
        if $ep_next_ok < 1 && $ep_from < 3
            if $ep_chr_hsin > 0
                $ep_chr_id = 3
                $ep_next_ok = 1
            endif
        endif
        if $ep_next_ok < 1 && $ep_from < 4
            if $ep_chr_hsinult > 0
                $ep_chr_id = 4
                $ep_next_ok = 1
            endif
        endif
        if $ep_next_ok < 1 && $ep_chr_suisui > 0
            $ep_chr_id = 0
            $ep_next_ok = 1
        endif
        if $ep_next_ok < 1 && $ep_chr_hsin > 0
            $ep_chr_id = 3
            $ep_next_ok = 1
        endif
        if $ep_next_ok < 1 && $ep_chr_hsinult > 0
            $ep_chr_id = 4
            $ep_next_ok = 1
        endif
    endif
endif
if $ep_chr_id < 0
    if $ep_chr_any > 0
        if $ep_chr_suisui > 0
            $ep_chr_id = 0
        elif $ep_chr_hsin > 0
            $ep_chr_id = 3
        elif $ep_chr_hsinult > 0
            $ep_chr_id = 4
        endif
    endif
endif

; ---- 2 SAVE 9 KEYS ----
$ep_switch_prev = $ep_switch_req

; ---- 2B NATIVE TOGGLE EDGES ----
$ep_nat_edge = 0
if $ep_nat_toggle_req > 0
    if $ep_nat_toggle_prev <= 0
        $ep_nat_edge = 1
    endif
endif
$ep_nat_toggle_prev = $ep_nat_toggle_req
run = CommandListEpNativeToggle

if $ep_chr_any > 0
    if $ep_chr_id != $ep_chr_prev
        $ep_av_flash = 6
    endif
endif
run = CommandListEpCharLayout
[CommandListEpCharLayout]
run = CommandListEpCharLayoutSuisui
run = CommandListEpCharLayoutHsin
run = CommandListEpCharLayoutHsinult

