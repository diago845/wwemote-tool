elif $ep_bind_tok == 38
    ps-t100 = ResourceEpTok038
elif $ep_bind_tok == 39
    ps-t100 = ResourceEpTok039
else
    ps-t100 = null
endif

[CommandListEpBindAvatar]
ps-t100 = null
run = CommandListEpBindAvatarSuisui
run = CommandListEpBindAvatarHsin
run = CommandListEpBindAvatarHsinult

[CommandListEpResolveRecipe]
run = CommandListEpResolveRecipeSuisui
run = CommandListEpResolveRecipeHsin
run = CommandListEpResolveRecipeHsinult

[CommandListEpBridgeSingle]
; ---- K-CHANNEL: RECIPE 0 ----

$ep_k_off = 0
if $ep_k_prev >= 0
    if $ep_act_tok != $ep_k_prev
        $ep_k_off = $ep_k_cur
    endif
endif

if $ep_act_tok == 40
    $\WWMIv1\shapekey_value = 1
    $ep_k_cur = 13
elif $ep_act_tok == 41
    $\WWMIv1\shapekey_value = 0.01
    $ep_k_cur = 112
elif $ep_act_tok == 0
    $\WWMIv1\shapekey_value = 0.25
    $ep_k_cur = 6
elif $ep_act_tok == 1
    $\WWMIv1\shapekey_value = 0.2
    $ep_k_cur = 12
elif $ep_act_tok == 2
    $\WWMIv1\shapekey_value = 0.3
    $ep_k_cur = 17
elif $ep_act_tok == 3
    $\WWMIv1\shapekey_value = 1.5
    $ep_k_cur = 40
elif $ep_act_tok == 4
    $\WWMIv1\shapekey_value = 1
    $ep_k_cur = 47
elif $ep_act_tok == 5
    $\WWMIv1\shapekey_value = 0.4
    $ep_k_cur = 16
elif $ep_act_tok == 6
    $\WWMIv1\shapekey_value = 0.15
    $ep_k_cur = 16
elif $ep_act_tok == 7
    $\WWMIv1\shapekey_value = 0.15
    $ep_k_cur = 10
elif $ep_act_tok == 8
    $\WWMIv1\shapekey_value = 0.15
    $ep_k_cur = 12
elif $ep_act_tok == 9
    $\WWMIv1\shapekey_value = 0.15
    $ep_k_cur = 5
elif $ep_act_tok == 10
    $\WWMIv1\shapekey_value = 1.85
    $ep_k_cur = 19
elif $ep_act_tok == 11
    $\WWMIv1\shapekey_value = 0.35
    $ep_k_cur = 12
elif $ep_act_tok == 12
    $\WWMIv1\shapekey_value = 0.25
    $ep_k_cur = 12
elif $ep_act_tok == 13
    $\WWMIv1\shapekey_value = 0.4
    $ep_k_cur = 6
elif $ep_act_tok == 14
    $\WWMIv1\shapekey_value = 0.15
    $ep_k_cur = 6
