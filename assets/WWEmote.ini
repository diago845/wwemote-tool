elif $ep_bind_tok == 34
    ps-t100 = ResourceEpTok034
elif $ep_bind_tok == 35
    ps-t100 = ResourceEpTok035
elif $ep_bind_tok == 36
    ps-t100 = ResourceEpTok036
elif $ep_bind_tok == 37
